[project]
name = "cairnlint-py"
version = "0.1.0"
description = "Heuristic agent-tier lint checks for Python, the sibling of cairnlint"
authors = [
    { name = "Chad England", email = "187918+chadit@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cairnlint-py = "cairnlint_py.cli:main"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "ARG",
    "SIM",
    "UP",
    "S",
    "N",
    "RUF",
    "PTH",
    "PL",
    "TID",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# pytest reports failures through bare assert statements, and a test's
# literal exit status or file mode is the contract it checks, not a magic value.
"tests/*" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
